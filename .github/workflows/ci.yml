name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      - name: Install dune
        run: opam install dune --yes

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune test
